{{/*
  Reo.dev, site-wide. Production only, so `hugo server` sessions are not tracked.
  Set params.reo_client_id to "" to switch it off.
*/}}
{{ if and hugo.IsProduction site.Params.reo_client_id }}
  <script type="text/javascript">
    !function(){var e,t,n;e="{{ site.Params.reo_client_id }}",t=function(){Reo.init({clientID:"{{ site.Params.reo_client_id }}", enableThirdPartyTracking: true})},(n=document.createElement("script")).src="https://static.reo.dev/"+e+"/reo.js",n.defer=!0,n.onload=t,document.head.appendChild(n)}();
  </script>
{{ end }}
